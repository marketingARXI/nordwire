<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo NordWire</title>
  <meta name="description" content="Catálogo de hardware industrial NordWire.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
  <link rel="stylesheet" href="assets/css/catalog.css">
</head>
<body class="catalog-page">
  <header class="catalog-header">
    <div class="catalog-header-inner">
      <a class="catalog-brand" href="index.html#produtos" data-i18n-aria-label="header.backLabel" aria-label="Voltar ao site NordWire">
        <span class="catalog-logo-frame" aria-hidden="true">
          <img src="assets/images/nordwire-logo.png" alt="">
        </span>
      </a>

      <div class="catalog-header-actions">
        <div class="language-switcher" role="group" aria-label="Seleção de idioma" data-i18n-aria-label="language.groupLabel">
          <button class="language-option is-active" type="button" data-language="pt" aria-pressed="true" aria-label="Usar Português" data-i18n-aria-label="language.ptLabel">
            <svg class="language-flag" viewBox="0 0 30 20" aria-hidden="true"><rect width="12" height="20" fill="#046a38"/><rect x="12" width="18" height="20" fill="#da291c"/><circle cx="12" cy="10" r="3.2" fill="#ffcd00"/><circle cx="12" cy="10" r="1.8" fill="#fff"/></svg>
          </button>
          <button class="language-option" type="button" data-language="en" aria-pressed="false" aria-label="Usar Inglês" data-i18n-aria-label="language.enLabel">
            <svg class="language-flag" viewBox="0 0 30 20" aria-hidden="true"><rect width="30" height="20" fill="#012169"/><path d="M0 0 30 20M30 0 0 20" stroke="#fff" stroke-width="5"/><path d="M0 0 30 20M30 0 0 20" stroke="#c8102e" stroke-width="2"/><path d="M15 0v20M0 10h30" stroke="#fff" stroke-width="6"/><path d="M15 0v20M0 10h30" stroke="#c8102e" stroke-width="3.2"/></svg>
          </button>
        </div>
        <a class="catalog-back-link" href="index.html#produtos">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          <span data-i18n="header.back">Voltar</span>
        </a>
      </div>
    </div>
  </header>

  <main class="catalog-main">
    <section class="catalog-intro" aria-labelledby="catalog-title">
      <p class="catalog-eyebrow" data-i18n="catalog.eyebrow">Catálogo</p>
      <h1 id="catalog-title" data-i18n="catalog.title">Hardware preparado para a indústria.</h1>
      <p data-i18n="catalog.subtitle">Explora uma seleção de soluções NordWire para captar, ligar e proteger os dados do chão de fábrica.</p>
    </section>

    <section class="catalog-layout" aria-label="Produtos e filtros" data-i18n-aria-label="catalog.regionLabel">
      <button class="filter-toggle" type="button" aria-expanded="false" aria-controls="catalog-filters" data-filter-toggle>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
        <span data-i18n="filters.open">Filtrar produtos</span>
      </button>

      <aside class="catalog-filters" id="catalog-filters" aria-labelledby="filters-title">
        <div class="filter-heading">
          <div>
            <p class="catalog-eyebrow" data-i18n="filters.eyebrow">Filtros</p>
            <h2 id="filters-title" data-i18n="filters.title">Categoria</h2>
          </div>
          <button class="filter-close" type="button" data-filter-close aria-label="Fechar filtros" data-i18n-aria-label="filters.close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <div class="filter-options" role="group" aria-label="Categorias de produto" data-i18n-aria-label="filters.groupLabel">
          <button class="filter-option is-active" type="button" data-filter="all" aria-pressed="true"><span data-i18n="filters.all">Todos</span><span data-filter-count="all">8</span></button>
          <button class="filter-option" type="button" data-filter="sensors" aria-pressed="false"><span data-i18n="category.sensors">Sensores</span><span data-filter-count="sensors">3</span></button>
          <button class="filter-option" type="button" data-filter="gateways" aria-pressed="false"><span data-i18n="category.gateways">Gateways</span><span data-filter-count="gateways">3</span></button>
          <button class="filter-option" type="button" data-filter="accessories" aria-pressed="false"><span data-i18n="category.accessories">Acessórios</span><span data-filter-count="accessories">2</span></button>
        </div>
      </aside>

      <div class="catalog-results">
        <div class="catalog-results-header">
          <p data-results-summary aria-live="polite">8 produtos</p>
        </div>
        <div class="product-grid" data-product-grid></div>
      </div>
    </section>
  </main>

  <dialog class="catalog-dialog product-dialog" data-product-dialog aria-labelledby="product-dialog-title">
    <div class="dialog-panel">
      <button class="dialog-close" type="button" data-close-product aria-label="Fechar detalhe" data-i18n-aria-label="detail.close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
      <div class="product-detail-visual">
        <img src="assets/images/catalog-product-placeholder.svg" alt="" data-detail-image>
      </div>
      <div class="product-detail-copy">
        <p class="product-category" data-detail-category></p>
        <h2 id="product-dialog-title" data-detail-name></h2>
        <p class="product-detail-description" data-detail-description></p>
        <p class="product-detail-price" data-detail-price></p>
        <button class="catalog-primary-button" type="button" data-open-quote data-i18n="detail.quote">Pedir orçamento</button>
      </div>
    </div>
  </dialog>

  <dialog class="catalog-dialog quote-dialog" data-quote-dialog aria-labelledby="quote-dialog-title">
    <div class="dialog-panel quote-panel">
      <button class="dialog-close" type="button" data-close-quote aria-label="Fechar formulário" data-i18n-aria-label="quote.close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
      <div class="quote-heading">
        <p class="catalog-eyebrow" data-i18n="quote.eyebrow">Pedido de orçamento</p>
        <h2 id="quote-dialog-title" data-i18n="quote.title">Fala-nos do que precisas.</h2>
        <p><span data-i18n="quote.product">Produto:</span> <strong data-quote-product></strong></p>
      </div>
      <form class="quote-form" data-quote-form method="post" novalidate data-integration-ready="true">
        <input type="hidden" name="produto" data-quote-product-input>
        <label class="catalog-field">
          <span data-i18n="form.name">Nome</span>
          <input type="text" name="nome" autocomplete="name" required aria-describedby="quote-name-error">
          <small id="quote-name-error" class="field-error"></small>
        </label>
        <label class="catalog-field">
          <span data-i18n="form.email">Email</span>
          <input type="email" name="email" autocomplete="email" required aria-describedby="quote-email-error">
          <small id="quote-email-error" class="field-error"></small>
        </label>
        <label class="catalog-field">
          <span data-i18n="form.quantity">Quantidade</span>
          <input type="number" name="quantidade" min="1" step="1" inputmode="numeric" required aria-describedby="quote-quantity-error">
          <small id="quote-quantity-error" class="field-error"></small>
        </label>
        <label class="catalog-field">
          <span data-i18n="form.note">Nota / Mensagem</span>
          <textarea name="mensagem" rows="4"></textarea>
        </label>
        <button class="catalog-primary-button" type="submit" data-i18n="quote.submit">Enviar pedido</button>
        <p class="quote-status" role="status" aria-live="polite" data-quote-status></p>
      </form>
    </div>
  </dialog>

  <script src="assets/js/catalog.js?v=20260824-2" defer></script>
</body>
</html>
